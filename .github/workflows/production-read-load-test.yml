name: Production Read Load Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Genan deployment URL"
        required: true
        type: string
      product_slug:
        description: "Existing Genan product slug"
        required: false
        type: string

permissions:
  contents: read

jobs:
  read-load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run safe staged production read test
        env:
          BASE_URL: ${{ inputs.base_url }}
          PRODUCT_SLUG: ${{ inputs.product_slug }}
        run: node scripts/production-read-load-test.mjs
